<style>

html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:radial-gradient(circle at top,#f5f3ff,#c4b5fd);background-attachment:fixed;color:var(--ink);user-select:none;-webkit-user-select:none;overflow-x:hidden}

#soundbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;background:#dc2626;color:#fff;border-radius:40px;padding:12px 20px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;font-size:1.05rem;animation:bob 1.2s infinite alternate}

/* start */
#start{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:22px}
#start h1{font-size:1.9rem;color:var(--p);line-height:1.15}

.hintline{color:#64748b;font-weight:700;font-size:.9rem;margin-top:10px}

.card{background:var(--card);border-radius:24px;box-shadow:0 12px 26px rgba(46,16,101,.12);border:1px solid #ede9fe}
.sect{margin:18px 4px 10px;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pd)}
.sect .ar{font-size:1.05rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.unit{padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-bottom:6px solid var(--c,#a78bfa);transition:transform .15s}
.unit:active{transform:scale(.96)}
.unit .ic{font-size:2.6rem;line-height:1}
.unit .en{font-weight:800;font-size:1.1rem;line-height:1.15}
.unit .ar{font-size:.85rem;color:#64748b;line-height:1.3}
.pats{font-weight:800;color:#b45309;font-size:.9rem;line-height:1.2}
.stars{font-size:.95rem;letter-spacing:1px;min-height:1.2em}
.adultbtn{margin:22px auto 0;display:flex;align-items:center;gap:8px;background:#fff;border:2px dashed #c4b5fd;border-radius:16px;padding:10px 18px;font-weight:800;color:var(--pd)}
/* unit screen */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.round{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #ddd6fe;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0;border:2px solid #ede9fe}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 #ddd6fe}
.round.replay{background:#fde047;border-color:#facc15;box-shadow:0 4px 0 #ca8a04;width:64px;height:64px;font-size:2rem}
.ttl{flex:1;text-align:center;min-width:0}
.ttl .en{font-weight:800;font-size:1.25rem;color:var(--p);line-height:1.1}
.ttl .ar{font-size:.85rem;color:#64748b}
.stages{display:flex;flex-direction:column;gap:14px}
.stage{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;border-left:8px solid var(--c)}
.stage .ic{width:74px;height:74px;border-radius:22px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:2.4rem;flex-shrink:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.stage .ar{font-size:1.3rem;font-weight:800;line-height:1.3}
.stage .en2{font-size:.85rem;color:#64748b;font-weight:700}
.stage.locked{opacity:.5;filter:grayscale(.6)}
.stage .num{margin-left:auto;font-size:1.4rem}
/* activity */
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#ddd6fe}
.dots i.d{background:var(--p2)}.dots i.c{background:var(--acc);transform:scale(1.25)}
.stagebox{padding:16px 12px;text-align:center}
.prompt{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;min-height:40px}
.picon{font-size:2rem}
.pic{display:block;margin:0 auto;max-width:100%;max-height:220px;object-fit:contain;border-radius:18px;border:4px solid #e9d5ff;background:#fff}
.pic.tap{cursor:pointer;box-shadow:0 6px 0 #e9d5ff}
.pic.tap:active{transform:translateY(3px)}
.pic.sm{max-height:120px}
.speak{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:linear-gradient(160deg,#3b82f6,#1d4ed8);color:#fff;font-size:2.1rem;box-shadow:0 5px 0 #1e3a8a;margin:10px auto}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 #1e3a8a}
.speak.playing,.playing{animation:ring .5s infinite alternate}
@keyframes ring{to{box-shadow:0 0 0 10px rgba(59,130,246,.25)}}

.chips{display:flex;justify-content:center;gap:6px;margin:12px 0;flex-wrap:nowrap;direction:ltr}
.chip{min-width:54px;height:66px;padding:0 10px;border-radius:16px;background:#f5f3ff;border:3px solid #ddd6fe;font-size:2.3rem;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:all .2s;position:relative;white-space:nowrap}
.chip.tg{background:#fef3c7;border-color:#f59e0b;color:#b45309}
.chip.dg{border-radius:20px;border-width:4px}
.chip.mg{background:#fce7f3;border-color:#ec4899;color:#be185d}
.chip.sil{opacity:.55;font-style:italic}
.chip.on{transform:translateY(-8px) scale(1.12);background:#bbf7d0;border-color:#22c55e;color:#14532d;box-shadow:0 8px 14px rgba(34,197,94,.35)}
.chip.blank{background:#fff;border-style:dashed;color:#a78bfa}
.chip.fill{background:#bbf7d0;border-color:#22c55e;border-style:solid;color:#14532d}
.chip .lk{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:.7rem;color:#64748b;font-weight:700}
.word{font-size:2.6rem;font-weight:800;letter-spacing:2px;margin:6px 0}
.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:10px 8px;border-radius:18px;background:#fff;border:3px solid #e9d5ff;box-shadow:0 4px 0 #e9d5ff;font-weight:800}
.tool .ic{font-size:1.8rem;line-height:1}
.tool .ar{font-size:.85rem}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #e9d5ff}
.tool.pr{background:#dcfce7;border-color:#86efac;box-shadow:0 4px 0 #86efac}
.next{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px auto 0;padding:14px 28px;border-radius:40px;background:linear-gradient(160deg,#22c55e,#16a34a);color:#fff;font-size:1.4rem;font-weight:800;box-shadow:0 6px 0 #14532d;min-width:180px}
.next:active{transform:translateY(4px);box-shadow:0 2px 0 #14532d}
.next[disabled]{opacity:.35;pointer-events:none}
/* letter card */
.letters{display:flex;justify-content:center;align-items:flex-end;gap:18px;font-weight:800;line-height:1;margin:4px 0 10px}
.letters .U{font-size:6.5rem;color:var(--p)}
.letters .l{font-size:5rem;color:#db2777}
.letters small{display:block;font-size:.8rem;color:#64748b;margin-top:6px;font-family:'Cairo';font-weight:700}
.ns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.nsb{padding:12px 8px;border-radius:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid}
.nsb.n{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.nsb.s{background:#fff7ed;border-color:#fdba74;color:#c2410c}
.nsb .big{font-size:1.6rem}
.nsb .ar{font-size:.9rem}
.wordsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wtile{background:#fff;border:3px solid #ede9fe;border-radius:18px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #ede9fe}
.wtile img{width:100%;height:84px;object-fit:contain}
.wtile b{font-size:1.25rem}
.wtile b span{color:#db2777}
.wtile:active{transform:translateY(3px)}
/* options */
.opts{display:grid;gap:10px;margin-top:12px}
.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:1fr 1fr 1fr}
.opt{background:#fff;border:4px solid #e9d5ff;border-radius:20px;box-shadow:0 5px 0 #e9d5ff;min-height:96px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:2rem;transition:all .15s}
.opt img{width:100%;height:110px;object-fit:contain}
.opts.c3 .opt img{height:92px}
.opt .lbl{font-size:1.15rem;color:var(--pd)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #e9d5ff}
.opt.right{background:#dcfce7;border-color:#22c55e;box-shadow:0 5px 0 #86efac}
.opt.wrong{animation:shake .45s;opacity:.35;pointer-events:none}
.opt.glow{animation:glow .7s infinite alternate;border-color:#f59e0b}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(245,158,11,.35),0 5px 0 #fcd34d;transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{background:#fff;border:4px solid #e9d5ff;border-radius:18px;min-height:86px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem;box-shadow:0 4px 0 #e9d5ff;padding:4px}
.mi img{max-height:76px;max-width:100%;object-fit:contain}
.mi.sel{background:#fef9c3;border-color:#eab308;transform:scale(1.04)}
.mi.done{background:#dcfce7;border-color:#22c55e;opacity:.75;pointer-events:none}
.mi.err{animation:shake .45s;border-color:#ef4444}
.mi.glow{animation:glow .7s infinite alternate}

.slots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.slot{min-width:52px;height:60px;border-radius:14px;border:3px dashed #c4b5fd;background:#fff;font-size:2.1rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 8px;color:#14532d}
.slot.f{border-style:solid;border-color:#22c55e;background:#dcfce7}
.model{font-size:1.9rem;font-weight:800;color:#a78bfa;letter-spacing:6px}
.arena{position:relative;height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#e0f2fe,#cffafe);margin-top:8px}
.bub{position:absolute;bottom:-110px;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--pd);background:radial-gradient(circle at 30% 30%,#fff,rgba(221,214,254,.9) 60%,rgba(139,92,246,.55));box-shadow:inset 0 0 14px #fff,0 4px 10px rgba(0,0,0,.15);animation:rise var(--dur,16s) linear infinite;animation-delay:var(--dl,0s)}
.bub.glow{background:radial-gradient(circle at 30% 30%,#fff,#fde68a 60%,#f59e0b);animation:rise var(--dur,16s) linear infinite,glowb .6s infinite alternate}

.bub.err{filter:hue-rotate(140deg)}
@keyframes rise{from{bottom:-110px}to{bottom:110%}}
.arena.paused .bub{animation-play-state:paused}
.speedbar{display:flex;justify-content:center;gap:8px;margin-top:8px}
.speedbar button{padding:8px 14px;border-radius:14px;background:#fff;border:3px solid #e9d5ff;font-size:1.3rem;font-weight:800}
.speedbar button.on{background:#ede9fe;border-color:var(--p2)}

.repeat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;margin-top:12px;background:#fdf4ff;border:3px dashed #f0abfc;border-radius:20px}
.mouth{font-size:3rem;animation:pulse .5s infinite alternate}
.ringbar{width:180px;height:12px;border-radius:8px;background:#fae8ff;overflow:hidden}
.ringbar i{display:block;height:100%;width:0;background:#d946ef;transition:width linear}
/* done */
.done{text-align:center;padding:24px 16px}
.done .big{font-size:4.5rem}
.done .st{font-size:2.6rem;letter-spacing:4px;margin:6px 0}
/* praise flash */
#praise{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:70;font-size:5rem;pointer-events:none;transition:all .3s}
#praise.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* demo */
#demo{position:fixed;inset:0;z-index:50;background:rgba(30,27,75,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#demo .box{background:#fff;border-radius:26px;padding:18px;max-width:360px;width:100%;text-align:center;position:relative}
#hand{position:absolute;font-size:3.4rem;z-index:3;transition:all 1s ease-in-out;pointer-events:none}
/* adults */
.adult h2{color:var(--p);margin:14px 0 6px;font-size:1.2rem}
.adult p,.adult li{font-family:'Cairo';direction:rtl;text-align:right;line-height:1.8;font-size:.98rem}
.adult ul{padding-right:18px}
.snd{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #f1f5f9;direction:ltr}
.snd b{min-width:70px}
.snd .st{margin-left:auto;font-family:'Cairo';font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:10px}
.st.dr{background:#fef3c7;color:#92400e}.st.ok{background:#dcfce7;color:#166534}
.pbtn{width:38px;height:38px;border-radius:50%;background:#ede9fe;font-size:1.1rem}
.btn{display:inline-block;padding:10px 16px;border-radius:14px;background:var(--p);color:#fff;font-weight:800;text-decoration:none;font-family:'Cairo';margin:6px 4px}
.btn.g{background:#e2e8f0;color:#334155}
footer{text-align:center;color:#6b7280;font-size:.8rem;margin-top:20px}
@media (max-width:420px){
 .brand{font-size:1rem}.logo{width:42px;height:42px;font-size:1rem}
 .chip{min-width:44px;height:58px;font-size:1.9rem;padding:0 7px}
 .opt{min-height:86px;font-size:1.7rem}.opt img{height:92px}.opts.c3 .opt img{height:74px}
 .letters .U{font-size:5.4rem}.letters .l{font-size:4.2rem}
 .bub{width:80px;height:80px;font-size:1.75rem}
 .stage .ic{width:62px;height:62px;font-size:2rem}.stage .ar{font-size:1.15rem}
}
</style>
</head>

const $ = s => document.querySelector(s);
const app = $('#app');
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= AUDIO: one player, one queue, nothing overlaps ================= */
const sfile = k => (k === k.toLowerCase() ? k : 'long-' + k.toLowerCase());
const AUD = {
  el: new Audio(), token: 0, rec: {}, unlocked: false, blocked: false, onState: null,
  async loadOverrides(){ try{ const r = await fetch(BASE + 'rec/manifest.json', {cache:'no-cache'}); if(r.ok) this.rec = await r.json(); }catch(e){} },
  url(key){
    if (this.rec[key]) return BASE + 'rec/' + this.rec[key];
    const [t, v] = [key.slice(0,1), key.slice(2)];
    if (t === 'w') return BASE + 'audio/w/' + v + '.mp3';
    if (t === 'n') return BASE + 'audio/n/name-' + v.toLowerCase() + '.mp3';
    if (t === 'p') return BASE + 'audio/p/' + sfile(v) + '.mp3';
    if (t === 'i') return BASE + 'audio/i/' + v + '.mp3';
    if (t === 'e') return BASE + 'audio/e/' + v + '.mp3';
    return null;
  },
  isRecorded(key){ return !!this.rec[key]; },
  stop(){ this.token++; const p = this.pending; this.pending = null; if (p) p(); try{ this.el.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); },
  /* play a list of keys in order; ms numbers = pauses; functions = callbacks (for highlighting) */
  async play(list, btn){
    this.stop(); const my = this.token; if (btn) btn.classList.add('playing');
    for (const k of [].concat(list)) {
      if (my !== this.token) return false;
      if (typeof k === 'number') { await wait(k); continue; }
      if (typeof k === 'function') { k(); continue; }
      await this.one(k, my);
    }
    if (btn && my === this.token) btn.classList.remove('playing');
    return my === this.token;
  },
  one(key, my){
    return new Promise(res => {
      const keys = key.startsWith('p:') && key.includes('+') ? key.slice(2).split('+').map(x=>'p:'+x) : [key];
      if (keys.length > 1) { (async()=>{ for (const k of keys){ if(my!==this.token) break; await this.one(k,my);} res(); })(); return; }
      const u = this.url(key); if (!u || my !== this.token) return res();
      const el = this.el; let done = false;
      const fin = () => { if (done) return; done = true; el.removeEventListener('ended', fin); el.removeEventListener('error', onErr); clearTimeout(t); if (this.pending === fin) this.pending = null; res(); };
      const onErr = () => { if (done) return; done = true; el.removeEventListener('ended', fin); el.removeEventListener('error', onErr); clearTimeout(t); if (this.pending === fin) this.pending = null; this.fallback(key, my).then(res); };
      const t = setTimeout(fin, 9000);
      this.pending = fin;                          // stop() resolves this immediately
      el.addEventListener('ended', fin); el.addEventListener('error', onErr);
      el.src = u;
      const p = el.play();
      if (p && p.catch) p.catch(err => { if (err && err.name === 'NotAllowedError') this.showBlocked(); if (err && err.name !== 'AbortError') fin(); });
    });
  },
  /* only for words: if a file is missing, use the device voice (English) */
  fallback(key, my){
    return new Promise(res => {
      if (!key.startsWith('w:') || !('speechSynthesis' in window) || my !== this.token) return res();
      try { const u = new SpeechSynthesisUtterance(key.slice(2)); u.lang = 'en-US'; u.rate = .85; u.onend = u.onerror = () => res(); speechSynthesis.speak(u); setTimeout(res, 4000); } catch(e){ res(); }
    });
  },
  silentWav(){
    // a real, valid 0.1 s silent WAV (8 kHz, 8-bit) so the unlock tap works on every browser
    const n = 800, buf = new Uint8Array(44 + n), dv = new DataView(buf.buffer), w = (o, t) => [...t].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
    w(0,'RIFF'); dv.setUint32(4, 36 + n, true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,8000,true); dv.setUint32(28,8000,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true); w(36,'data'); dv.setUint32(40,n,true); buf.fill(128, 44);
    let bin = ''; buf.forEach(b => bin += String.fromCharCode(b)); return 'data:audio/wav;base64,' + btoa(bin);
  },
  unlock(){
    const el = this.el; el.src = this.silentWav();
    const p = el.play(); this.unlocked = true;
    if (p && p.catch) p.then(() => this.hideBlocked()).catch(err => { if (err && err.name === 'NotAllowedError') this.showBlocked(); });
    try { speechSynthesis.getVoices(); } catch(e){}
  },
  showBlocked(){ this.blocked = true; $('#soundbar').classList.remove('hidden'); },
  hideBlocked(){ this.blocked = false; $('#soundbar').classList.add('hidden'); }
};
$('#soundbar').onclick = () => { AUD.unlock(); setTimeout(()=>{ if(!AUD.blocked) replay(); }, 300); };

const W = DATA.words, CONF = DATA.conf;

const clear = w => W[w] && W[w].clear;
const conf = (a, b) => (CONF[a] || []).includes(b);
function pickOptions(target, pool, n){
  const out = [target];
  for (const w of shuf(pool)) { if (out.length >= n) break; if (out.includes(w) || !clear(w)) continue; if (out.some(o => conf(o, w) || o[0] && w === o)) continue; out.push(w); }
  return out.length >= 2 ? shuf(out) : null;
}
function praise(){ const p = $('#praise'); p.textContent = rnd(['🌟','👏','🎉','⭐','💪']); p.classList.add('show'); setTimeout(()=>p.classList.remove('show'), 700); return 'e:' + rnd(['great','super','welldone','yes']); }

/* target chip indexes for a pattern inside a word */
function targetIdx(chips, pat){
  if (!chips) return [];
  if (pat.includes('_')) return chips.map((c,i)=>c.magic?i:-1).filter(i=>i>=0);
  const p = pat.replace(/^-/, ''); const txt = chips.map(c=>c.t); const s = txt.join('');
  let at = pat.startsWith('-') ? s.length - p.length : s.indexOf(p);
  if (at < 0) return [];
  const out = []; let pos = 0;
  txt.forEach((t,i) => { const a = pos, b = pos + t.length; if (a < at + p.length && b > at) out.push(i); pos = b; });
  return out;
}
function chipsHTML(chips, tgt=[], opts={}){
  return `<div class="chips">` + chips.map((c,i) => {
    let cls = 'chip'; if (c.t.length > 1 && !opts.plain) cls += ' dg'; if (tgt.includes(i)) cls += ' tg'; if (c.magic) cls += ' mg'; if (c.s === '') cls += ' sil';
    const blank = opts.blank && opts.blank.includes(i);
    if (blank) cls += ' blank';
    return `<div class="${cls}" data-i="${i}">${blank ? '?' : esc(c.t)}</div>`;
  }).join('') + `</div>`;
}
/* sound sequence for blending: each chip lights up while its sound plays, then the whole word */
function blendSeq(w, chips, root){
  const seq = [];
  const el = i => root.querySelector(`.chip[data-i="${i}"]`);
  chips.forEach((c,i) => { if (c.s === '') return; seq.push(() => { root.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); el(i) && el(i).classList.add('on'); }); seq.push('p:' + c.s); seq.push(250); });
  seq.push(() => root.querySelectorAll('.chip').forEach(x=>x.classList.add('on')));
  seq.push(150, 'w:' + w, 300, () => root.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')));
  return seq;
}

/* ================= stage runner ================= */
function runStage(u, stage){
  const steps = BUILD[u.kind](u, stage);
  let i = 0, first = 0, total = 0;
  const S = { u, stage, score(ok){ total++; if (ok) first++; } };
  const next = () => {
    AUD.stop();
    if (i >= steps.length) return stageDone(u, stage, first, total);
    const step = steps[i++];
    app.innerHTML = topbar(u.title_en, STAGES.find(s=>s.k===stage).ar, 'back') +
      `<div class="dots">${steps.map((_,j)=>`<i class="${j<i-1?'d':j===i-1?'c':''}"></i>`).join('')}</div><div class="card stagebox" id="box"></div>`;
    bindTop(() => showUnit(u));
    step($('#box'), next, S);
    window.scrollTo(0,0);
  };
  next();
}
function stageDone(u, stage, first, total){
  const p = PROG[u.id] = PROG[u.id] || {};
  let stars = 3;
  if (total) { const r = first / total; stars = r >= .85 ? 3 : r >= .6 ? 2 : 1; }
  if (stage === 'learn') p.learn = true; else p[stage] = Math.max(p[stage] || 0, stars);
  save(PROG);
  const nextStage = stage === 'learn' ? 'guided' : stage === 'guided' ? 'play' : null;
  app.innerHTML = topbar(u.title_en, u.title_ar, 'back') + `<div class="card done"><div class="big">🏆</div>
    ${stage==='learn' ? '' : `<div class="st">${starsTxt(stars)}</div>`}
    <div class="ar" style="font-size:1.3rem;font-weight:800;color:#4c1d95">أحسنت! خلّصت المرحلة</div>
    ${nextStage ? `<button class="next" id="nx">${STAGES.find(s=>s.k===nextStage).ic} <span class="ar">${STAGES.find(s=>s.k===nextStage).ar}</span></button>` : ''}
    <button class="next" id="again" style="background:linear-gradient(160deg,#a855f7,#7c3aed);box-shadow:0 6px 0 #4c1d95">🔄 <span class="ar">مرة كمان</span></button></div>`;
  bindTop(() => showUnit(u));
  CUR_REPLAY = ['i:stage_done'];
  AUD.play([praise(), 200, 'i:stage_done']);
  if (nextStage) $('#nx').onclick = () => runStage(u, nextStage);
  $('#again').onclick = () => runStage(u, stage);
}

    `<div class="tools">
       <button class="tool" id="hear"><span class="ic">🔊</span><span class="ar">اسمع</span></button>

       <button class="tool" id="rp"><span class="ic">🦜</span><span class="ar">ردّد ورايا</span></button>
     </div><div id="rpbox"></div><button class="next" id="nx" disabled>➜</button>`;
  const nx = box.querySelector('#nx'); let heard = false;
  const ready = () => { heard = true; nx.disabled = false; };
  const say = (b) => AUD.play(['w:' + w], b).then(ready);
  box.querySelectorAll('.pic').forEach((p, k) => p.onclick = () => { if (it.pair && k === 0) AUD.play(['w:' + it.pair], p); else say(p); });

  if (chips) box.querySelector('#bl').onclick = e => AUD.play(blendSeq(w, chips, box), e.currentTarget).then(ready);
  if (g.sound && box.querySelector('#psnd')) box.querySelector('#psnd').onclick = e => AUD.play(['p:' + g.sound, 300, 'w:' + (g.words[0].w)], e.currentTarget);
  box.querySelector('#rp').onclick = () => repeatAfterMe(box.querySelector('#rpbox'), w).then(ready);
  nx.onclick = next;
  const seq = [];
  if (intro) seq.push('i:' + intro, 300);
  if (g.sound && intro) seq.push('p:' + g.sound, 400);
  if (it.pair) seq.push('w:' + it.pair, 500, 'i:magic', 300);
  seq.push(...(chips ? blendSeq(w, chips, box) : ['w:' + w]));
  CUR_REPLAY = chips ? blendSeq(w, chips, box) : ['w:' + w];
  AUD.play(seq).then(ok => { if (ok) ready(); });
};
function hiWord(w, pat){
  const p = pat.replace(/^-/, '').replace('_e','');
  const i = pat.includes('_') ? -1 : w.indexOf(p);
  if (i < 0) return esc(w);
  return esc(w.slice(0,i)) + `<span style="color:#d97706">${esc(w.slice(i,i+p.length))}</span>` + esc(w.slice(i+p.length));
}

/* listen, your turn, listen again — optional: record yourself and hear it (stays on this device) */
function repeatAfterMe(holder, w){
  return new Promise(async res => {
    holder.innerHTML = `<div class="repeat"><div class="mouth">👂</div><div class="ringbar"><i></i></div>
      <button class="tool" id="mic" style="border-color:#f0abfc;box-shadow:0 4px 0 #f0abfc"><span class="ic">🎙️</span><span class="ar">سجّل صوتك (مع ولي الأمر)</span></button></div>`;
    const mouth = holder.querySelector('.mouth'), bar = holder.querySelector('.ringbar i');
    holder.querySelector('#mic').onclick = () => recordSelf(holder, w);
    const alive = () => document.body.contains(holder);
    if (!await AUD.play(['i:repeat', 200, 'w:' + w]) || !alive()) return res();
    mouth.textContent = '🗣️';
    if (!await AUD.play(['e:yourturn']) || !alive()) return res();
    const tk = AUD.token;
    bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = 'width 3s linear'; bar.style.width = '100%';
    await wait(3100);
    if (tk !== AUD.token || !alive()) return res();          // the child moved on or pressed something else
    mouth.textContent = '👂';
    if (!await AUD.play(['i:listen_again', 200, 'w:' + w]) || !alive()) return res();
    mouth.textContent = '✅'; res();
  });
}
async function recordSelf(holder, w){
  const box = holder.querySelector('.repeat');
  if (!navigator.mediaDevices || !window.MediaRecorder) { box.insertAdjacentHTML('beforeend','<div class="ar" style="color:#b91c1c">التسجيل غير مدعوم على هذا المتصفح</div>'); return; }
  AUD.stop();
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e) { box.insertAdjacentHTML('beforeend','<div class="ar" style="color:#b91c1c">لم يُسمح باستخدام الميكروفون</div>'); return; }
  const rec = new MediaRecorder(stream), parts = [];
  rec.ondataavailable = e => parts.push(e.data);
  const mouth = box.querySelector('.mouth'); mouth.textContent = '🔴';
  rec.start(); await wait(2500); rec.stop(); stream.getTracks().forEach(t=>t.stop());
  await new Promise(r => rec.onstop = r);
  const url = URL.createObjectURL(new Blob(parts, {type: rec.mimeType}));
  mouth.textContent = '🧒';
  const me = new Audio(url); await new Promise(r => { me.onended = r; me.onerror = r; me.play().catch(r); });

  mouth.textContent = '✅'; URL.revokeObjectURL(url);
}

/* -- learn: letter card -- */

const firstHi = w => `<span>${esc(w[0])}</span>${esc(w.slice(1))}`;

/* -- generic "choose" question with hint + retry; never ends the game -- */
function choose(box, {prompt, intro, say, options, render, cols, correct, after, S, glowAfter=2, onWrongSay}){
  box.innerHTML = `${prompt}<div class="opts ${cols}">${options.map((o,k)=>`<button class="opt" data-k="${k}">${render(o)}</button>`).join('')}</div>`;
  let wrong = 0, done = false;
  CUR_REPLAY = say;
  box.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if (done) return;
    const o = options[+b.dataset.k];
    if (o === correct) {
      done = true; S.score(wrong === 0); b.classList.remove('glow'); b.classList.add('right');
      await AUD.play([praise(), 150, ...(after || [])]);
      setTimeout(S._next, 250);
    } else {
      wrong++; b.classList.add('wrong');
      if (wrong >= glowAfter) { const r = [...box.querySelectorAll('.opt')].find(x => options[+x.dataset.k] === correct); r && r.classList.add('glow'); AUD.play(['i:hint', 200, ...say]); }
      else AUD.play(['i:try_again', 200, ...(onWrongSay || say)]);
    }
  });
  AUD.play([...(intro ? ['i:' + intro, 300] : []), ...say]);
}
const promptBox = (inner) => `<div class="prompt">${inner}</div>`;
const speakBtn = `<button class="speak" data-say>🔊</button>`;
function bindSpeak(box){ const b = box.querySelector('[data-say]'); if (b) b.onclick = () => replay(b); }

ACT.listenPick = (w, pool, labels, intro, n) => (box, next, S) => {
  S._next = next;
  const options = pickOptions(w, pool, n) || [w];
  choose(box, { S, intro, prompt: promptBox(speakBtn), say: ['w:' + w], options, cols: options.length === 3 ? 'c3' : 'c2', correct: w,
    render: o => img(o) + (labels ? `<span class="lbl">${esc(o)}</span>` : ''), after: ['w:' + w] });

};

/* missing part of a word: picture + sound, choose the missing letter(s) */
ACT.missing = (it, blankIdx, choices, intro) => (box, next, S) => {
  S._next = next;
  const chips = it.chips, ans = blankIdx.map(i => chips[i].t).join('');
  const label = s => s.includes('_') || blankIdx.length > 1 && chips[blankIdx[0]].magic ? s : s;
  const ansLabel = chips[blankIdx[0]].magic ? chips[blankIdx[0]].t + '_e' : ans;
  const options = shuf([ansLabel, ...choices.filter(c => c !== ansLabel)].slice(0, 3));
  choose(box, { S, intro, cols: 'c3', correct: ansLabel, options,
    prompt: img(it.w, 'pic sm') + `<div>${speakBtn}</div>` + chipsHTML(chips, [], {blank: blankIdx}),
    say: ['w:' + it.w], render: o => `<span style="font-size:2.1rem">${esc(o)}</span>`,
    after: [() => box.querySelectorAll('.chip.blank').forEach(c => { c.textContent = chips[+c.dataset.i].t; c.classList.add('fill'); }), 'w:' + it.w] });
  bindSpeak(box);
};

/* matching: words (or capital letters) with pictures (or small letters) */
ACT.match = (pairs, intro, guided) => (box, next, S) => {
  // pairs: [{a: html for left, b: html for right, id, say}]
  const L = shuf(pairs), R = shuf(pairs);
  box.innerHTML = `<div class="mgrid"><div class="mcol">${L.map(p=>`<button class="mi" data-side="a" data-id="${p.id}">${p.a}</button>`).join('')}</div>
    <div class="mcol">${R.map(p=>`<button class="mi" data-side="b" data-id="${p.id}">${p.b}</button>`).join('')}</div></div>`;
  CUR_REPLAY = ['i:' + intro];
  let sel = {a:null, b:null}, misses = {}, left = pairs.length;
  box.querySelectorAll('.mi').forEach(m => m.onclick = async () => {
    const side = m.dataset.side, id = m.dataset.id, p = pairs.find(x => x.id === id);
    box.querySelectorAll(`.mi[data-side="${side}"]`).forEach(x => x.classList.remove('sel'));
    m.classList.add('sel'); sel[side] = m;
    if (side === 'b' || guided || misses[id]) AUD.play(p.say);
    if (sel.a && sel.b) {
      const a = sel.a, b = sel.b; sel = {a:null, b:null};
      if (a.dataset.id === b.dataset.id) {
        a.classList.remove('sel','glow'); b.classList.remove('sel','glow'); a.classList.add('done'); b.classList.add('done');
        S.score(!misses[id]); left--;
        await AUD.play([praise(), 100, ...p.say]);
        if (!left) setTimeout(next, 400);
      } else {
        const ida = a.dataset.id; misses[ida] = (misses[ida] || 0) + 1;
        a.classList.add('err'); b.classList.add('err');
        setTimeout(() => { a.classList.remove('err','sel'); b.classList.remove('err','sel'); }, 450);
        const pa = pairs.find(x => x.id === ida);
        if (misses[ida] >= 2) { box.querySelector(`.mi[data-side="b"][data-id="${ida}"]`).classList.add('glow'); AUD.play(['i:hint', 200, ...pa.say]); }
        else AUD.play(['i:try_again', 200, ...pa.say]);
      }
    }
  });
  AUD.play(['i:' + intro]);
};

/* build a word: tiles (guided, word shown) or floating bubbles (dictation) */
ACT.build = (it, mode, extra) => (box, next, S) => {
  const chips = it.chips.filter(c => true), w = it.w;
  const need = chips.map(c => c.t);
  const pool = shuf([...need, ...extra.filter(x => !need.includes(x)).slice(0, mode === 'bubbles' ? 2 : 1)]);
  let pos = 0, wrong = 0, firstTry = true;
  const showModel = mode !== 'bubbles';
  box.innerHTML = `${img(w,'pic sm')}<div>${speakBtn}</div>
    ${showModel ? `<div class="model">${esc(w)}</div>` : ''}
    <div class="slots">${need.map((_,i)=>`<div class="slot" data-i="${i}"></div>`).join('')}</div>
    ${mode === 'bubbles'
      ? `<div class="arena" id="ar">${(() => { const cols = shuf(pool.map((_,k)=>k)), dls = shuf(pool.map((_,k)=>k)); return pool.map((t,k)=>`<button class="bub" data-t="${esc(t)}" style="left:${3 + cols[k] * (74 / Math.max(1,pool.length-1))}%;--dl:${-(dls[k] * 26 / pool.length) - 2}s">${esc(t)}</button>`).join(''); })()}</div>
         <div class="speedbar"><button data-sp="26" class="on" aria-label="slow">🐢</button><button data-sp="16" aria-label="normal">🐇</button><button data-sp="0" aria-label="pause">⏸️</button></div>`
      : `<div class="opts c3" id="ar">${pool.map(t=>`<button class="opt bub2" data-t="${esc(t)}"><span style="font-size:2.2rem">${esc(t)}</span></button>`).join('')}</div>`}`;
  const arena = box.querySelector('#ar');
  CUR_REPLAY = ['w:' + w];
  bindSpeak(box);
  if (mode === 'bubbles') {
    arena.querySelectorAll('.bub').forEach(b => b.style.setProperty('--dur', '26s'));
    box.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
      box.querySelectorAll('[data-sp]').forEach(x => x.classList.remove('on')); b.classList.add('on');
      if (b.dataset.sp === '0') arena.classList.add('paused'); else { arena.classList.remove('paused'); arena.querySelectorAll('.bub').forEach(x => x.style.setProperty('--dur', b.dataset.sp + 's')); }
    });
  }
  const sel = mode === 'bubbles' ? '.bub' : '.bub2';
  const glowNext = () => { arena.querySelectorAll(sel).forEach(b => b.classList.remove('glow')); const n = [...arena.querySelectorAll(sel)].find(b => b.dataset.t === need[pos] && !b.disabled); n && n.classList.add('glow'); };
  arena.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    if (pos >= need.length || b.disabled) return;
    const t = b.dataset.t;
    if (t === need[pos]) {
      const slot = box.querySelector(`.slot[data-i="${pos}"]`); slot.textContent = t; slot.classList.add('f');
      const c = chips[pos]; pos++; wrong = 0;
      arena.querySelectorAll(sel).forEach(x => x.classList.remove('glow'));
      if (need.indexOf(t, pos) === -1) { b.disabled = true; if (mode === 'bubbles') b.classList.add('pop'); else b.style.visibility = 'hidden'; }
      if (pos >= need.length) { S.score(firstTry); arena.classList.add('paused'); await AUD.play([praise(), 150, 'w:' + w]); setTimeout(next, 300); }
      else if (c.s) AUD.play(['p:' + c.s]);
    } else {
      wrong++; firstTry = false; b.classList.add('err'); setTimeout(() => b.classList.remove('err'), 500);
      b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}], {duration:300});
      if (wrong >= 2) { glowNext(); AUD.play(['i:hint', 150, 'w:' + w]); } else AUD.play(['i:try_again', 150, 'w:' + w]);
    }
  });
  AUD.play([...(it._intro ? ['i:' + it._intro, 300] : []), 'w:' + w]);
};

/* letters: hear something, pick the letter */
ACT.pickLetter = (L, pool, by, intro, n) => (box, next, S) => {
  S._next = next;
  const say = by === 'name' ? ['n:' + L.letter] : ['p:' + L.sound];
  const opts = shuf([L.letter, ...shuf(pool.filter(x => x !== L.letter)).slice(0, n - 1)]);
  choose(box, { S, intro, prompt: promptBox(speakBtn), say, options: opts, cols: n === 3 ? 'c3' : 'c2', correct: L.letter,
    render: o => `<span style="font-size:3.2rem">${by === 'name' ? o.toUpperCase() + ' ' + o : o}</span>`,
    after: [...say, 300, 'w:' + L.words[0]] });
  bindSpeak(box);
};
ACT.firstLetter = (w, letter, pool, intro) => (box, next, S) => {
  S._next = next;
  const opts = shuf([letter, ...shuf(pool.filter(x => x !== letter)).slice(0, 2)]);
  choose(box, { S, intro, cols: 'c3', correct: letter, options: opts,
    prompt: img(w,'pic sm') + `<div>${speakBtn}</div><div class="chips"><div class="chip blank">?</div><div class="chip">${esc(w.slice(1))}</div></div>`,
    say: ['w:' + w], render: o => `<span style="font-size:3rem">${o}</span>`,
    after: [() => { const b = box.querySelector('.chip.blank'); b.textContent = letter; b.classList.add('fill'); }, 'w:' + w] });
  bindSpeak(box);
};
ACT.middle = (it, vowels, intro) => (box, next, S) => {   // short-vowel review: which sound is in the middle?
  S._next = next;
  const v = it.chips[1].t;
  const opts = shuf([v, ...shuf(vowels.filter(x => x !== v)).slice(0, 2)]);
  choose(box, { S, intro, cols: 'c3', correct: v, options: opts,
    prompt: img(it.w,'pic sm') + `<div>${speakBtn}</div>` + chipsHTML(it.chips, [], {blank:[1]}),
    say: ['w:' + it.w], render: o => `<span style="font-size:3rem">${o}</span>`,
    onWrongSay: ['w:' + it.w, 300, 'p:' + v],
    after: [() => { const b = box.querySelector('.chip.blank'); b.textContent = v; b.classList.add('fill'); }, 'p:' + v, 200, 'w:' + it.w] });
  bindSpeak(box);
};

/* ================= what each unit kind contains, per stage ================= */
const take = (a, n) => shuf(a).slice(0, n);
function unitWords(u){ return u.groups.flatMap(g => g.words.map(x => ({...x, g}))); }
function lettersOf(u){ return u.letters.map(L => L.letter); }
const BUILD = {
  letters(u, stage){
    const Ls = u.letters, ls = lettersOf(u);
    if (stage === 'learn') return Ls.map((L, k) => ACT.letterCard({...L, intro: k === 0}));
    const casePairs = (arr) => arr.map(L => ({id: L.letter, a: `<span style="font-size:2.6rem">${L.letter.toUpperCase()}</span>`, b: `<span style="font-size:2.6rem">${L.letter}</span>`, say: ['n:' + L.letter]}));
    if (stage === 'guided') return [
      ACT.match(casePairs(take(Ls, 3)), 'match_case', true),
      ...take(Ls, 4).map((L,k) => ACT.pickLetter(L, ls, 'sound', k === 0 ? 'hear_sound' : null, 2)),
    ];
    const allW = Ls.flatMap(L => L.words.map(w => ({w, L})));
    return [
      ...take(Ls, 3).map((L,k) => ACT.pickLetter(L, ls, 'name', k === 0 ? 'hear_name' : null, 3)),
      ...take(allW, 4).map((x,k) => ACT.firstLetter(x.w, x.L.letter, ls, k === 0 ? 'first_letter' : null)),
      ACT.match(casePairs(take(Ls, Math.min(5, Ls.length))), 'match_case', false),
    ];
  },
  short: wordUnit, digraph: wordUnit, blend: wordUnit, endblend: wordUnit, long: wordUnit, oo: wordUnit, r: wordUnit, family: wordUnit, magic: magicUnit,
  shortmix(u, stage){
    const vs = u.groups.map(g => g.pat);
    if (stage === 'learn') return u.groups.map((g, k) => ACT.wordCard(g.words[0], {...g, head: 'short ' + g.pat, intro: k === 0 ? 'middle' : null}, u));
    const all = unitWords(u).filter(x => x.chips && x.chips.length === 3);
    if (stage === 'guided') return take(all, 6).map((it,k) => ACT.middle(it, vs, k === 0 ? 'middle' : null));
    return [...take(all, 6).map((it,k) => ACT.middle(it, vs, k === 0 ? 'middle' : null)),
            ...take(all.filter(x => clear(x.w)), 3).map((it,k) => ACT.build(it, 'bubbles', vs))];
  },
};
const INTRO = {short:'family', digraph:'digraph', blend:'blend2', endblend:'blend2', long:'long', oo:'learn', r:'learn', family:'family'};
function wordUnit(u, stage){
  const all = unitWords(u), clearW = all.filter(x => clear(x.w)), pool = all.map(x => x.w);
  if (stage === 'learn') {
    const steps = [];
    u.groups.forEach((g, gi) => g.words.forEach((it, k) => {
      const head = u.kind === 'short' ? 'word family' : u.kind === 'digraph' ? 'حرفان = صوت واحد' : (u.kind === 'blend' || u.kind === 'endblend') ? 'كل حرف له صوت' : '';
      steps.push(ACT.wordCard(it, {...g, head: k === 0 ? head : '', intro: k === 0 ? (gi === 0 ? INTRO[u.kind] : 'learn') : null}, u));
    }));
    return steps;
  }
  const buildable = all.filter(x => x.chips && x.chips.length <= 5);
  const patsOfUnit = [...new Set(u.groups.map(g => g.pat))];
  const extraChips = u.kind === 'short' ? ['a','e','i','o','u','b','d','g','p','t'] : [...new Set([...patsOfUnit.map(p => p.replace(/^-/,'').replace('_e','')), 's','t','p','n'])];
  // missing part: L1 = the vowel (or first letter); L2 = the unit's pattern
  const missingStep = (x, k) => {
    if (u.kind === 'short') {
      const vowelFirst = k % 2 === 0;
      if (vowelFirst) return ACT.missing(x, [1], ['a','e','i','o','u'], k === 0 ? 'missing' : null);
      const firsts = [...new Set(pool.map(w => w[0]))];
      return ACT.missing(x, [0], shuf(firsts), null);
    }
    const idx = targetIdx(x.chips, x.g.pat);
    let ch = patsOfUnit.filter(p => p !== x.g.pat).map(p => p.replace(/^-/,''));
    if (ch.length < 2) ch = ch.concat(({family:['ell','ill','ull'], oo:['ee','oa','ai'], r:['ee','oa']}[u.kind] || ['ee','oa','ai']).filter(p => p !== x.g.pat));
    return ACT.missing(x, idx, shuf(ch), k === 0 ? 'missing_pat' : null);
  };
  const missable = buildable.filter(x => u.kind === 'short' || targetIdx(x.chips, x.g.pat).length);
  if (stage === 'guided') {
    const lp = take(clearW, 4).map((x,k) => ACT.listenPick(x.w, pool, true, k === 0 ? 'pick_pic' : null, 2));
    const bd = take(buildable, 2).map((x,k) => ACT.build({...x, _intro: k === 0 ? 'build_model' : null}, 'tiles', extraChips));
    return [...lp, ...bd];
  }
  const m4 = take(clearW, 4);
  return [
    ...take(clearW, 3).map((x,k) => ACT.listenPick(x.w, pool, false, k === 0 ? 'pick_pic' : null, 3)),
    ...(m4.length >= 3 ? [ACT.match(m4.map(x => ({id: x.w, a: `<span>${esc(x.w)}</span>`, b: img(x.w), say: ['w:' + x.w]})), 'match', false)] : []),
    ...take(missable, 3).map(missingStep),
    ...take(buildable.filter(x => clear(x.w)), 2).map((x,k) => ACT.build({...x, _intro: k === 0 ? 'build_dict' : null}, 'bubbles', extraChips)),
  ];
}
function magicUnit(u, stage){
  const items = unitWords(u);
  if (stage === 'learn') return items.map((it,k) => ACT.wordCard(it, {...it.g, head: 'magic e', intro: k === 0 ? 'magic' : null}, u));
  const pickPair = (it, labels, intro) => (box, next, S) => {   // hear cap or cape, pick the right picture
    S._next = next; const target = Math.random() < .5 ? it.w : it.pair;
    choose(box, { S, intro, prompt: promptBox(speakBtn), say: ['w:' + target], options: shuf([it.w, it.pair]), cols: 'c2', correct: target,
      render: o => img(o) + (labels ? `<span class="lbl">${esc(o)}</span>` : ''), after: ['w:' + target] });
    bindSpeak(box);
  };
  const pickWord = (it, intro) => (box, next, S) => {           // see + hear cape, pick the written word
    S._next = next; const target = Math.random() < .5 ? it.w : it.pair;
    choose(box, { S, intro, prompt: img(target,'pic sm') + `<div>${speakBtn}</div>`, say: ['w:' + target], options: shuf([it.w, it.pair]), cols: 'c2', correct: target,
      render: o => `<span style="font-size:2.4rem">${esc(o)}</span>`, after: ['w:' + target] });
    bindSpeak(box);
  };
  if (stage === 'guided') return items.map((it,k) => pickPair(it, true, k === 0 ? 'pick_pic' : null));
  return [...shuf(items).map((it,k) => pickPair(it, false, k === 0 ? 'pick_pic' : null)), ...shuf(items).slice(0,4).map(it => pickWord(it, null)),
          ...take(items, 2).map((it,k) => ACT.build({...it, _intro: k === 0 ? 'build_dict' : null}, 'bubbles', ['a','i','u','o','e']))];
}

   <div style="text-align:center"><button class="btn g" id="rs">مسح تقدّم الطفل على الجهاز ده</button></div>
   <h2 class="ar" style="text-align:right">مصادر</h2>
   <p>صور الكلمات من كتب Ms. Naglaa Yehia. صور إضافية لتمهيد الحروف من Twemoji (رخصة CC-BY 4.0، © Twitter/X وآخرين). نطق الكلمات الإنجليزية مولّد بمحرّك Kokoro (رخصة Apache 2.0)، والتعليمات العربية بصوت آلي (Piper ar_JO). أي صوت تسجّله المعلمة بيحلّ محلّ الصوت الآلي تلقائيًا.</p></div>`;
  bindTop(() => showMap());
  const sl = app.querySelector('#sl');
  sl.innerHTML = keys.map(k => `<div class="snd"><button class="pbtn" data-k="${k}">🔈</button><b>${esc(DATA.sounds[k].label)}</b><span style="color:#64748b">${esc(DATA.sounds[k].ex)}</span>
     <span class="st ${AUD.isRecorded('p:'+k)?'ok':'dr'}">${AUD.isRecorded('p:'+k)?'مسجّل من المعلمة':'مسودة آلية — تحتاج مراجعة'}</span></div>`).join('');
  sl.querySelectorAll('.pbtn').forEach(b => b.onclick = () => AUD.play(['p:' + b.dataset.k, 300, 'w:' + DATA.sounds[b.dataset.k].ex], b));
  app.querySelector('#rs').onclick = () => { PROG = {}; save(PROG); app.querySelector('#rs').textContent = '✔ اتمسح'; };
}

AUD.loadOverrides();
showStart();
</script>
